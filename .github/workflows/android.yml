name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare local secrets file
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ ! -f .env.example ]; then
            printf 'YOUTUBE_API_KEY=your_api_key_here\n' > .env.example
          fi
          if [ -n "$YOUTUBE_API_KEY" ]; then
            printf 'YOUTUBE_API_KEY=%s\n' "$YOUTUBE_API_KEY" > .env
          else
            echo 'YOUTUBE_API_KEY secret is not configured; API-backed features will be unavailable.'
            printf 'YOUTUBE_API_KEY=your_api_key_here\n' > .env
          fi

      - name: Run unit tests and assemble debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
          else
            gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
